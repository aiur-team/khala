name: release-listener

# Builds, smokes and publishes the shared listener reference (packages/listener) to npm as
# `khala-listener`, using npm OIDC trusted publishing, as release-npm.yml does for the CLI. npm matches
# the trusted publisher on this workflow's filename, so both channels run from THIS file.
#
# Channels:
#   stable   push of a listener-v* tag, or workflow_dispatch with channel=stable. The version is
#            packages/listener/package.json's; a tag must agree. Publishes under `latest`.
#   dry-run  default for workflow_dispatch. Builds, smokes and runs `npm publish --dry-run`,
#            asserting the OIDC exchange. Nothing reaches the registry.
on:
  push:
    tags:
      - "listener-v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options:
          - dry-run
          - stable
        default: dry-run

permissions:
  contents: read

concurrency:
  group: release-listener-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Resolve channel and version
        id: resolve
        run: |
          version=$(node -p "require('./packages/listener/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/listener-v* ]]; then
            channel=stable
            if [ "${GITHUB_REF_NAME#listener-v}" != "$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match packages/listener/package.json version $version" >&2
              exit 1
            fi
          else
            channel="${{ inputs.channel }}"
            channel="${channel:-dry-run}"
          fi
          publish=false
          [ "$channel" = "stable" ] && publish=true
          if [ "$publish" = true ] && [ -n "$(npm view "khala-listener@$version" version 2>/dev/null || true)" ]; then
            echo "khala-listener@$version is already published; bump packages/listener/package.json" >&2
            exit 1
          fi
          {
            echo "channel=$channel"
            echo "version=$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @khala/listener typecheck
      - run: pnpm --filter @khala/listener test
      - run: node packages/listener/scripts/pack.mjs
      - name: Pack and smoke
        run: |
          mkdir -p "$GITHUB_WORKSPACE/listener-dist" "$RUNNER_TEMP/smoke"
          npm pack ./packages/listener/dist --pack-destination "$GITHUB_WORKSPACE/listener-dist"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/listener-dist/*.tgz
          node --input-type=module -e "
            const m = await import('khala-listener');
            if (m.wakesOn('mute', true, false) || !m.wakesOn('async', true, true)) process.exit(1);
            await import('node:fs').then(fs => fs.accessSync('node_modules/khala-listener/spec/v1/MANIFEST.json'));
          "
      - uses: actions/upload-artifact@v4
        with:
          name: khala-listener-tarball
          path: listener-dist/*.tgz
          if-no-files-found: error

  publish:
    name: publish (${{ needs.build.outputs.channel }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required for the OIDC token npm exchanges for a short-lived credential.
      id-token: write
      contents: read
    steps:
      # No registry-url, deliberately: it writes an empty _authToken and npm then skips the OIDC
      # exchange (actions/setup-node#1551). See release-npm.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: khala-listener-tarball
          path: artifacts

      # `npm publish --dry-run` swallows a failed OIDC exchange (npm/cli#8525); require evidence.
      - name: Dry-run publish and assert OIDC exchange
        if: needs.build.outputs.publish != 'true'
        run: |
          set -o pipefail
          tgz=./$(ls artifacts/*.tgz)
          npm publish "$tgz" --dry-run --access public --loglevel verbose 2>&1 | tee out.log
          if grep -q "Failed token exchange request" out.log || ! grep -qiE 'oidc|trusted publish' out.log; then
            echo "OIDC trusted publishing preflight failed; configure release-listener.yml on npmjs.com" >&2
            exit 1
          fi

      - name: Publish
        if: needs.build.outputs.publish == 'true'
        run: npm publish ./artifacts/*.tgz --access public

      - name: Verify registry state
        if: needs.build.outputs.publish == 'true'
        run: |
          v="${{ needs.build.outputs.version }}"
          deadline=$((SECONDS + 300))
          until [ "$(npm view "khala-listener@$v" version 2>/dev/null || true)" = "$v" ]; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "registry did not show khala-listener@$v within 300s" >&2; exit 1; }
            sleep 5
          done
