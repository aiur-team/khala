name: release-npm

# Builds, smokes and publishes the `khala` CLI package (packages/agent/npm) to npm.
#
# Publishing uses npm OIDC trusted publishing, not an npm token. npm matches the
# trusted publisher on this workflow's filename, so every channel -- stable and
# dry run -- is triggered on THIS file. A separate publishing workflow, or a
# reusable-workflow indirection, presents a different `workflow_ref` claim and is
# rejected (npm/documentation#1755). Modelled on aiur-team/aiur's release-npm.yml,
# without its platform-binary matrix: Khala's package is plain JavaScript.
#
# Channels:
#   stable   push of a v* tag, or workflow_dispatch with channel=stable.
#            The version is packages/agent/npm/package.json's; a tag must agree.
#            Publishes under `latest`.
#   dry-run  default for workflow_dispatch. Builds, smokes and runs
#            `npm publish --dry-run`, asserting the OIDC exchange. Nothing reaches
#            the registry.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options:
          - dry-run
          - stable
        default: dry-run

permissions:
  contents: read

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      name: ${{ steps.resolve.outputs.name }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # packages/agent/npm/package.json is the single source of truth for the
      # published name and version. A v* tag must name exactly that version.
      - name: Resolve channel and version
        id: resolve
        run: |
          name=$(node -p "require('./packages/agent/npm/package.json').name")
          version=$(node -p "require('./packages/agent/npm/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            channel=stable
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match packages/agent/npm/package.json version $version" >&2
              exit 1
            fi
          else
            channel="${{ inputs.channel }}"
            channel="${channel:-dry-run}"
          fi
          publish=false
          [ "$channel" = "stable" ] && publish=true
          {
            echo "channel=$channel"
            echo "name=$name"
            echo "version=$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      # The version must be unreleased: npm never accepts a version twice, and a
      # stable run that reaches publish with a taken version fails half-way.
      - name: Verify the version is unreleased
        if: steps.resolve.outputs.publish == 'true'
        run: |
          spec="${{ steps.resolve.outputs.name }}@${{ steps.resolve.outputs.version }}"
          if [ -n "$(npm view "$spec" version 2>/dev/null || true)" ]; then
            echo "$spec is already published; bump packages/agent/npm/package.json and run sync-release.mjs" >&2
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| channel | ${{ steps.resolve.outputs.channel }} |"
            echo "| package | ${{ steps.resolve.outputs.name }}@${{ steps.resolve.outputs.version }} |"
            echo "| publishes | ${{ steps.resolve.outputs.publish }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build and test
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The Claude plugin pins the package name and version in its launcher;
      # a release whose plugin points elsewhere would install the wrong CLI.
      - name: Check plugin pins match the package
        run: node packages/agent/scripts/sync-release.mjs --check

      - run: pnpm --filter @khala/agent typecheck
      - run: pnpm --filter @khala/agent test
      - run: pnpm --filter @khala/agent build
      - run: pnpm --filter khala-opencode typecheck
      - run: pnpm --filter khala-opencode test
      - run: pnpm --filter khala-opencode build
      - name: Pack OpenCode plugin
        run: |
          mkdir -p "$GITHUB_WORKSPACE/opencode-dist"
          pnpm --dir packages/opencode-plugin pack --pack-destination "$GITHUB_WORKSPACE/opencode-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: khala-opencode-tarball
          path: opencode-dist/*.tgz
          if-no-files-found: error

      - name: Pack
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd packages/agent/npm
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: khala-cli-tarball
          path: dist/*.tgz
          if-no-files-found: error

  # Prove the tarball works with no checkout: a global install answers --version,
  # a hook and an MCP initialize, on the oldest and newest supported Node lines.
  smoke:
    name: smoke node ${{ matrix.node }} ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22.18.0" }
          - { os: ubuntu-latest, node: "24" }
          - { os: macos-14, node: "22" }
          - { os: windows-latest, node: "22" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: khala-cli-tarball
          path: artifacts
      # bash expands the glob on Windows too.
      - shell: bash
        run: node packages/agent/scripts/smoke-package.mjs artifacts/*.tgz

  publish:
    name: publish (${{ needs.setup.outputs.channel }})
    needs: [setup, build, smoke]
    runs-on: ubuntu-latest
    permissions:
      # Required for the OIDC token npm exchanges for a short-lived credential.
      id-token: write
      contents: read
    steps:
      # No registry-url here, deliberately. setup-node's registry-url writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc
      # unconditionally; with no token that resolves to an empty string, npm
      # believes auth is already configured, skips the OIDC exchange, and fails
      # with a misleading ENEEDAUTH/E404. See actions/setup-node#1551.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Trusted publishing needs npm >= 11.5.1; assert it rather than trust the
      # bundled version.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          node -e '
            const need = [11, 5, 1];
            const got = process.argv[1].split(".").map(Number);
            for (let i = 0; i < 3; i++) {
              if (got[i] > need[i]) break;
              if (got[i] < need[i]) {
                console.error(`npm ${process.argv[1]} is older than 11.5.1; OIDC trusted publishing is unsupported`);
                process.exit(1);
              }
            }
          ' "$(npm --version)"
          test ! -f ~/.npmrc || ! grep -q _authToken ~/.npmrc

      - uses: actions/download-artifact@v4
        with:
          name: khala-cli-tarball
          path: artifacts

      # `npm publish --dry-run` attempts the OIDC exchange but swallows a failure
      # and returns 0 (npm/cli#8525), so a broken trusted-publisher config would
      # pass silently. Run it verbose and require positive evidence instead.
      - name: Dry-run publish and assert OIDC exchange
        if: needs.setup.outputs.publish != 'true'
        run: |
          set -o pipefail
          # ./ prefix: npm 11 reads a bare artifacts/x.tgz as a GitHub user/repo spec (EALLOWGIT).
          tgz=./$(ls artifacts/*.tgz)
          npm publish "$tgz" --dry-run --access public --loglevel verbose 2>&1 | tee out.log
          if grep -q "Failed token exchange request" out.log; then
            echo "OIDC token exchange FAILED; configure the trusted publisher on npmjs.com" >&2
            grep -i oidc out.log >&2 || true
            exit 1
          elif ! grep -qiE 'oidc|trusted publish' out.log; then
            echo "No OIDC exchange was attempted; this preflight proved nothing." >&2
            exit 1
          fi

      - name: Publish
        if: needs.setup.outputs.publish == 'true'
        run: npm publish ./artifacts/*.tgz --access public

      - name: Verify registry state
        if: needs.setup.outputs.publish == 'true'
        run: |
          pkg="${{ needs.setup.outputs.name }}"
          v="${{ needs.setup.outputs.version }}"
          # The registry is read-your-writes only after propagation: `npm view`
          # can 404 for a version `npm publish` already accepted. Poll a bounded
          # window so "not visible yet" is not reported as "not published".
          deadline=$((SECONDS + 300))
          delay=5
          until [ "$(npm view "$pkg@$v" version 2>/dev/null || true)" = "$v" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "registry did not show $pkg@$v within 300s" >&2
              exit 1
            fi
            sleep "$delay"
            [ "$delay" -lt 30 ] && delay=$((delay * 2))
          done
          latest=$(npm view "$pkg" dist-tags.latest 2>/dev/null || true)
          {
            echo "| package | published | latest |"
            echo "| --- | --- | --- |"
            echo "| $pkg | $v | $latest |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-opencode:
    name: publish OpenCode (${{ needs.setup.outputs.channel }})
    needs: [setup, build, smoke]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: khala-opencode-tarball
          path: opencode-artifacts
      - name: Check operator bootstrap
        id: bootstrap
        run: |
          if npm view khala-opencode name > /dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping khala-opencode publication: hand-publish a placeholder and configure the release-npm.yml trusted publisher first."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dry-run OpenCode publish and assert OIDC exchange
        if: steps.bootstrap.outputs.ready == 'true' && needs.setup.outputs.publish != 'true'
        run: |
          set -o pipefail
          tgz=./$(ls opencode-artifacts/*.tgz)
          npm publish "$tgz" --dry-run --access public --loglevel verbose 2>&1 | tee opencode-out.log
          if grep -q "Failed token exchange request" opencode-out.log || ! grep -qiE 'oidc|trusted publish' opencode-out.log; then
            echo "OpenCode trusted publishing preflight failed; configure release-npm.yml on npmjs.com" >&2
            exit 1
          fi
      - name: Publish OpenCode
        if: steps.bootstrap.outputs.ready == 'true' && needs.setup.outputs.publish == 'true'
        run: npm publish ./opencode-artifacts/*.tgz --access public
      - name: Verify OpenCode registry version
        if: steps.bootstrap.outputs.ready == 'true' && needs.setup.outputs.publish == 'true'
        run: |
          version="${{ needs.setup.outputs.version }}"
          deadline=$((SECONDS + 300))
          until [ "$(npm view "khala-opencode@$version" version 2>/dev/null || true)" = "$version" ]; do
            [ "$SECONDS" -lt "$deadline" ] || exit 1
            sleep 5
          done
