name: Deletion guard
# Server-side backstop for the Aiur pre-push deletion guard. The worker-side
# guard is advisory: a 2026-09-25 audit found 70 of 289 agent pushes where it
# never ran (masked by a pipe, `;`, `|| true`, or skipped outright). This check
# runs on GitHub, where no worker shell can reach it, and is required by branch
# protection on `main`. A PR that removes files fails unless a repository
# admin applied the `allow-deletions` label. The label's presence is not
# trusted: the agent account has write access and can label PRs, so the check
# reads who applied the label and requires that person to be an admin.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  deletion-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unapproved file deletions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          removed="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | select(.status == "removed") | .filename')"
          if [ -z "$removed" ]; then
            echo "No files removed."
            exit 0
          fi
          echo "This PR removes $(printf '%s\n' "$removed" | wc -l) file(s):"
          printf '  %s\n' $removed
          # Who most recently applied the label? Read the timeline so a later
          # `synchronize` run still sees it; the event sender alone would not.
          labeller="$(gh api --paginate "repos/$REPO/issues/$PR/timeline" \
            --jq '.[] | select(.event == "labeled" and .label.name == "allow-deletions") | .actor.login' | tail -n1)"
          still_labelled="$(gh api "repos/$REPO/issues/$PR/labels" --jq '[.[].name] | index("allow-deletions") != null')"
          if [ "$still_labelled" = "true" ] && [ -n "$labeller" ]; then
            role="$(gh api "repos/$REPO/collaborators/$labeller/permission" --jq .permission 2>/dev/null || echo none)"
            if [ "$role" = "admin" ]; then
              echo "Allowed: allow-deletions was applied by $labeller (admin)."
              exit 0
            fi
            echo "::error::allow-deletions was applied by $labeller ($role). Only a repository admin can approve deletions."
            exit 1
          fi
          echo "::error::This PR deletes files and needs deletion approval from a repository admin. Agents: do not add labels; stop and ask the Executor."
          exit 1
