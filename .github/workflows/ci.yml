name: CI
on:
  # `push:` with no filter ran a full build for every commit on every branch,
  # and `pull_request:` then ran the same commit again. Over 2026-09 that was
  # 219 commits validated twice and 746 wasted minutes, on the one private repo
  # where minutes are metered. Validate a branch through its pull request;
  # validate `main` on push, because that is the commit nothing else checks.
  push:
    branches: [main]
  pull_request:

# A branch pushed again while CI is still running does not need the older
# answer -- the newer commit is the one that will merge. `main` is exempt: every
# commit that lands there gets its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Install sandbox test tool
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor
          # Ubuntu 24.04 restricts unprivileged user namespaces. Allow this
          # test tool explicitly, following the Ubuntu release-note guidance.
          sudo tee /etc/apparmor.d/khala-ci-bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile khala-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/khala-ci-bwrap
          bwrap --unshare-pid --ro-bind / / --proc /proc --dev /dev /bin/true
      - run: pnpm test
      - name: Browser tests
        run: |
          CHROMIUM_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          export CHROMIUM_PATH
          pnpm test:browser
      # Screenshot baselines only match the browser, fonts and rasteriser they
      # were taken with, so this runs in the pinned Playwright image (keep the
      # tag equal to the @playwright/test version). Two passes prove the
      # baselines are stable, and the final check proves nothing rewrote them.
      - name: Visual baselines
        run: |
          docker run --rm --ipc=host --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true \
            -e COREPACK_ENABLE_DOWNLOAD_PROMPT=0 \
            -v "$PWD:$PWD" -w "$PWD" mcr.microsoft.com/playwright:v1.63.0-noble \
            sh -c 'corepack pnpm --filter @khala/web test:visual && corepack pnpm --filter @khala/web test:visual'
          git diff --exit-code -- apps/web/src
          test -z "$(git status --porcelain --untracked-files=all -- apps/web/src)"
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: apps/web/test-results/
          if-no-files-found: ignore
      - run: pnpm build

  # The published CLI must install and serve MCP on native Windows too (Cursor on Windows
  # runs it directly, not through WSL). Pack once on Linux, smoke on Linux and Windows.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @khala/agent build
      - name: Pack
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd packages/agent/npm
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: khala-cli-tarball
          path: dist/*.tgz
          if-no-files-found: error

  package-smoke:
    name: package smoke ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: khala-cli-tarball
          path: artifacts
      - name: Smoke the packed CLI
        shell: bash
        run: node packages/agent/scripts/smoke-package.mjs artifacts/*.tgz
