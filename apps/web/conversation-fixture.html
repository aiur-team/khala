<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Khala conversation fixture</title>
<style>body{margin:0;background:#111;color:#eee}.fixture-page{box-sizing:border-box;max-width:1440px;margin:auto;padding:24px}.fixture-controls{display:flex;gap:8px;margin-bottom:16px}.fixture-messages{list-style:none;display:flex;flex-direction:column;gap:4px;flex:1;min-height:0;overflow:auto;margin:0;padding:20px;background:var(--khala-fill)}.fixture-messages .timeline__row{align-self:flex-start;max-width:78%;padding:.5rem .8rem;border-radius:18px;background:var(--khala-fill-control)}.fixture-messages .timeline__row--mine{align-self:flex-end;background:var(--khala-accent);color:white}.fixture-messages .timeline__row-header{display:flex;gap:8px;font-size:.74rem;color:var(--khala-ink-muted)}.fixture-messages .timeline__body{font-size:.92rem;line-height:1.4}@media(max-width:760px){.fixture-page{padding:8px}}</style></head>
<body><div class="khala-content-root fixture-page" data-theme="dark"><div class="fixture-controls"><button type="button" onclick="document.querySelector('.khala-content-root').dataset.theme='dark';document.documentElement.dataset.theme='dark'">Dark</button><button type="button" onclick="document.querySelector('.khala-content-root').dataset.theme='light';document.documentElement.dataset.theme='light'">Light</button></div><div id="fixture"></div></div><script type="module" src="/src/ui/conversation/fixture-main.tsx"></script></body></html>
